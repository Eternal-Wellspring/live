<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Tree</title>
  <style>
    :root {
      --ink: #1b3a4b;
      --muted: #5a6a72;
      --line: #c5d0d4;
      --paper: #f6f7eb;
      --panel: #fff;
      --accent: #1f6f78;
      --title: #005eb8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.2rem 0.5rem;
      background: var(--panel);
      border-bottom: 0;
    }
    .bar button {
      font: 700 0.82rem Arial, Helvetica, sans-serif;
      padding: 0.12rem 0.45rem;
      border: 1px solid var(--line);
      background: #f4f7f8;
      color: var(--ink);
      cursor: pointer;
    }
    .bar button:hover { background: #e8eef0; }
    .note { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
    .board-wrap {
      flex: 1 1 auto;
      overflow: auto;
      background: var(--panel);
    }
    .board { position: relative; min-width: 100%; min-height: 100%; }
    .board svg { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }
    .box {
      position: absolute;
      z-index: 2;
      width: auto;
      margin: 0;
      padding: 0.2rem 1.35rem 0.2rem 0.4rem;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    .box:hover { background: #f4f7f8; }
    .box.on { background: #f6efc8; z-index: 3; }
    .name { display: block; font-weight: 400; white-space: nowrap; }
    .more { display: block; margin-top: 0.1rem; color: var(--muted); font-size: 0.78rem; font-weight: 400; }
    .tog {
      position: absolute;
      top: 0.15rem;
      right: 0.15rem;
      width: 1.15rem;
      height: 1.15rem;
      padding: 0;
      border: 1px solid var(--line);
      background: #f4f7f8;
      color: var(--ink);
      font: 700 0.85rem/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .tog:hover { background: #e8eef0; }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" id="foldall" title="Fold each stream to one box">Compact streams</button>
    <button type="button" id="openall" title="Show every topic">Expand all</button>
    <span class="note" id="status"></span>
  </div>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board"><div style="padding:1rem;color:#5a6a72">Loading tree…</div></div>
  </div>
  <script src="topics-tree.js?v=203"></script>
</body>
</html>
