<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics tree</title>
  <style>
    :root {
      --ink: #1b3a4b;
      --muted: #5a6a72;
      --line: #c5d0d4;
      --paper: #f6f7eb;
      --panel: #fff;
      --accent: #1f6f78;
      --title: #005eb8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.2rem 0.5rem;
      background: var(--panel);
      border-bottom: 0;
    }
    .bar button {
      font: 700 0.82rem Arial, Helvetica, sans-serif;
      padding: 0.12rem 0.45rem;
      border: 1px solid var(--line);
      background: #f4f7f8;
      color: var(--ink);
      cursor: pointer;
    }
    .bar button:hover { background: #e8eef0; }
    .note { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
    .board-wrap {
      flex: 1 1 auto;
      overflow: auto;
      background: var(--panel);
    }
    .board { position: relative; min-width: 100%; min-height: 100%; }
    .board svg { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }
    .box {
      position: absolute;
      z-index: 2;
      width: auto;
      margin: 0;
      padding: 0.2rem 1.35rem 0.2rem 0.4rem;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    .box:hover { background: #f4f7f8; }
    .box.on {
      background: #f6efc8;
      z-index: 3;
    }
    .name { display: block; font-weight: 400; white-space: nowrap; }
    .more { display: block; margin-top: 0.1rem; color: var(--muted); font-size: 0.78rem; font-weight: 400; }
    .tog {
      position: absolute;
      top: 0.15rem;
      right: 0.15rem;
      width: 1.15rem;
      height: 1.15rem;
      padding: 0;
      border: 1px solid var(--line);
      background: #f4f7f8;
      color: var(--ink);
      font: 700 0.85rem/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .tog:hover { background: #e8eef0; }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" id="foldall" title="Fold each stream to one box">Compact streams</button>
    <button type="button" id="openall" title="Show every topic">Expand all</button>
    <span class="note" id="status"></span>
  </div>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board"></div>
  </div>
  <script>
    var GAP_X = 20;
    var GAP_Y = 36;
    var PAD = 14;
    var topics = [];
    var sel = null;
    var pinSel = false;
    var folded = {};
    var byId = {};
    var oSuc = {};
    var oPred = {};
    var rootId = (function () {
      var q = location.search.replace(/^\?/, "").split("&");
      var i, p;
      for (i = 0; i < q.length; i++) {
        p = q[i].split("=");
        if (p[0] === "id") return decodeURIComponent(p[1] || "");
      }
      return "";
    })();
    function sid(v) { return String(v); }
    function bySeq() {
      return topics.slice().sort(function (a, b) { return (a.seq || 0) - (b.seq || 0); });
    }
    function visible() {
      var list = bySeq();
      if (!rootId) return list;
      var start = -1, rootLv = 1, i;
      for (i = 0; i < list.length; i++) {
        if (sid(list[i].id) === sid(rootId)) {
          start = i;
          rootLv = list[i].level || 1;
          break;
        }
      }
      if (start < 0) return list;
      var out = [];
      for (i = start; i < list.length; i++) {
        if (i > start && (list[i].level || 1) <= rootLv) break;
        out.push(list[i]);
      }
      if (!out.length) out = [list[start]];
      return out;
    }
    function titleOf(id) {
      var t = byId[sid(id)];
      return t ? t.title : String(id);
    }
    function seqOf(id) {
      var t = byId[sid(id)];
      return t ? (t.seq || 0) : 0;
    }
    function sortIds(arr) {
      arr.sort(function (a, b) { return seqOf(a) - seqOf(b); });
      return arr;
    }
    function addEdge(mapS, mapP, a, b) {
      a = sid(a); b = sid(b);
      if (!byId[a] || !byId[b] || a === b) return;
      if (mapS[a].indexOf(b) < 0) mapS[a].push(b);
      if (mapP[b].indexOf(a) < 0) mapP[b].push(a);
    }
    function emptyMaps(nodes) {
      var s = {}, p = {};
      nodes.forEach(function (t) {
        s[sid(t.id)] = [];
        p[sid(t.id)] = [];
      });
      return { suc: s, pred: p };
    }
    function graphItems() {
      return visible();
    }
    function outlineParent(items, i) {
      var lv = items[i].level || 1;
      var j;
      for (j = i - 1; j >= 0; j--) {
        if ((items[j].level || 1) < lv) return sid(items[j].id);
      }
      return "";
    }
    function buildOrig() {
      byId = {};
      var items = graphItems();
      items.forEach(function (t) { byId[sid(t.id)] = t; });
      var m = emptyMaps(items);
      oSuc = m.suc;
      oPred = m.pred;
      var i, p;
      for (i = 0; i < items.length; i++) {
        p = outlineParent(items, i);
        if (p) addEdge(oSuc, oPred, p, items[i].id);
      }
      Object.keys(oSuc).forEach(function (k) { sortIds(oSuc[k]); });
      Object.keys(oPred).forEach(function (k) { sortIds(oPred[k]); });
      return items;
    }
    function chainFrom(id) {
      id = sid(id);
      var chain = [id];
      var n = id;
      var guard = 0;
      while (guard++ < 80) {
        var outs = oSuc[n] || [];
        if (outs.length !== 1) break;
        var nxt = outs[0];
        var ins = oPred[nxt] || [];
        if (ins.length !== 1) break;
        if (chain.indexOf(nxt) >= 0) break;
        chain.push(nxt);
        n = nxt;
      }
      return chain;
    }
    function isHead(id) {
      return chainFrom(id).length >= 2;
    }
    function isMaximalHead(id) {
      if (!isHead(id)) return false;
      var ps = oPred[sid(id)] || [];
      if (ps.length === 1 && (oSuc[ps[0]] || []).length === 1) return false;
      return true;
    }
    function absorbedMap() {
      var abs = {};
      Object.keys(folded).forEach(function (id) {
        if (!folded[id]) return;
        var ch = chainFrom(id);
        var i;
        for (i = 1; i < ch.length; i++) abs[ch[i]] = id;
      });
      return abs;
    }
    function displayId(id, abs) {
      id = sid(id);
      var guard = 0;
      while (abs[id] && guard++ < 20) id = abs[id];
      return id;
    }
    function loadFold() {
      folded = {};
      try {
        var raw = sessionStorage.getItem("ew-sn-fold-" + (rootId || "all"));
        var arr = raw ? JSON.parse(raw) : [];
        (arr || []).forEach(function (id) { folded[sid(id)] = true; });
      } catch (e) {}
    }
    function saveFold() {
      try {
        sessionStorage.setItem(
          "ew-sn-fold-" + (rootId || "all"),
          JSON.stringify(Object.keys(folded).filter(function (k) { return folded[k]; }))
        );
      } catch (e) {}
    }
    function toggleFold(id, ev) {
      if (ev) ev.stopPropagation();
      id = sid(id);
      if (folded[id]) delete folded[id];
      else folded[id] = true;
      saveFold();
      sel = id;
      pinSel = true;
      paint();
    }
    function paint() {
      var wrap = document.getElementById("wrap");
      var sx = wrap.scrollLeft, sy = wrap.scrollTop;
      var items = buildOrig();
      var abs = absorbedMap();
      if (sel && abs[sid(sel)]) sel = displayId(sel, abs);
      var shown = items.filter(function (t) { return !abs[sid(t.id)]; });
      var dm = emptyMaps(shown);
      var dSuc = dm.suc, dPred = dm.pred;
      var seen = {};
      items.forEach(function (t) {
        (oSuc[sid(t.id)] || []).forEach(function (b) {
          var a = displayId(t.id, abs);
          var c = displayId(b, abs);
          if (a === c) return;
          var k = a + ">" + c;
          if (seen[k]) return;
          seen[k] = true;
          addEdge(dSuc, dPred, a, c);
        });
      });
      Object.keys(dSuc).forEach(function (k) { sortIds(dSuc[k]); });
      Object.keys(dPred).forEach(function (k) { sortIds(dPred[k]); });
      var rank = {};
      var visiting = {};
      function rec(id) {
        id = sid(id);
        if (rank[id] != null) return rank[id];
        if (visiting[id]) return 0;
        visiting[id] = true;
        var ps = dPred[id] || [];
        var r = 0, i, n;
        for (i = 0; i < ps.length; i++) {
          n = rec(ps[i]) + 1;
          if (n > r) r = n;
        }
        visiting[id] = false;
        rank[id] = r;
        return r;
      }
      shown.forEach(function (t) { rec(t.id); });
      var cols = [];
      var maxR = 0;
      shown.forEach(function (t) {
        var r = rank[sid(t.id)] || 0;
        if (r > maxR) maxR = r;
        if (!cols[r]) cols[r] = [];
        cols[r].push(sid(t.id));
      });
      var r;
      for (r = 0; r <= maxR; r++) {
        if (!cols[r]) cols[r] = [];
        cols[r].sort(function (a, b) { return seqOf(a) - seqOf(b); });
      }
      function idx(id, rr) {
        var list = cols[rr] || [];
        var i = list.indexOf(sid(id));
        return i < 0 ? 0 : i;
      }
      function bary(id, neigh, rr) {
        var ns = neigh[sid(id)] || [];
        var i, s = 0, n = 0;
        for (i = 0; i < ns.length; i++) {
          if (rank[ns[i]] === rr) {
            s += idx(ns[i], rr);
            n += 1;
          }
        }
        return n ? s / n : idx(id, rank[sid(id)] || 0);
      }
      var pass, i;
      for (pass = 0; pass < 4; pass++) {
        for (r = 1; r <= maxR; r++) {
          cols[r].sort(function (a, b) {
            var da = bary(a, dPred, r - 1) - bary(b, dPred, r - 1);
            return da || (seqOf(a) - seqOf(b));
          });
        }
        for (r = maxR - 1; r >= 0; r--) {
          cols[r].sort(function (a, b) {
            var da = bary(a, dSuc, r + 1) - bary(b, dSuc, r + 1);
            return da || (seqOf(a) - seqOf(b));
          });
        }
      }
      var board = document.getElementById("board");
      board.innerHTML = "";
      var pos = {};
      shown.forEach(function (t) {
        var id = sid(t.id);
        var lv = t.level || 1;
        if (lv > 4) lv = 4;
        var b = document.createElement("button");
        b.type = "button";
        b.className = "box lv" + lv + (id === sid(sel) ? " on" : "");
        b.dataset.id = id;
        var name = document.createElement("span");
        name.className = "name";
        name.textContent = t.title || "";
        b.appendChild(name);
        var ch = chainFrom(id);
        if (folded[id] && ch.length > 1) {
          var more = document.createElement("span");
          more.className = "more";
          more.textContent = "→ " + titleOf(ch[ch.length - 1]) + "  ·  " + ch.length + " topics";
          b.appendChild(more);
        }
        if (isHead(id)) {
          var tog = document.createElement("button");
          tog.type = "button";
          tog.className = "tog";
          tog.textContent = folded[id] ? "+" : "−";
          tog.title = folded[id] ? "Expand this stream" : "Compact this stream";
          tog.addEventListener("click", function (ev) { toggleFold(id, ev); });
          b.appendChild(tog);
        }
        b.addEventListener("click", function (ev) {
          ev.stopPropagation();
          sel = id;
          pinSel = true;
          paint();
        });
        board.appendChild(b);
        pos[id] = { el: b, w: Math.ceil(b.offsetWidth), h: Math.ceil(b.offsetHeight) };
      });
      function midX(id) { return pos[id].x + pos[id].w / 2; }
      var rowH = [];
      for (r = 0; r <= maxR; r++) {
        rowH[r] = 0;
        cols[r].forEach(function (id) {
          if (pos[id].h > rowH[r]) rowH[r] = pos[id].h;
        });
      }
      var y = PAD;
      for (r = 0; r <= maxR; r++) {
        var x = PAD;
        cols[r].forEach(function (id) {
          pos[id].x = x;
          pos[id].y = y;
          x += pos[id].w + GAP_X;
        });
        y += rowH[r] + GAP_Y;
      }
      for (pass = 0; pass < 3; pass++) {
        shown.forEach(function (t) {
          var id = sid(t.id);
          var ns = (dPred[id] || []).concat(dSuc[id] || []);
          if (!ns.length) return;
          var s = 0, n = 0;
          for (i = 0; i < ns.length; i++) {
            if (pos[ns[i]]) { s += midX(ns[i]); n += 1; }
          }
          if (!n) return;
          pos[id].x = s / n - pos[id].w / 2;
        });
        for (r = 0; r <= maxR; r++) {
          var list = cols[r].slice().sort(function (a, b) { return pos[a].x - pos[b].x; });
          cols[r] = list;
          var nx = PAD;
          for (i = 0; i < list.length; i++) {
            if (pos[list[i]].x < nx) pos[list[i]].x = nx;
            nx = pos[list[i]].x + pos[list[i]].w + GAP_X;
          }
        }
      }
      var maxX = PAD, maxY = PAD;
      shown.forEach(function (t) {
        var id = sid(t.id);
        var p = pos[id];
        p.el.style.left = p.x + "px";
        p.el.style.top = p.y + "px";
        if (p.x + p.w + PAD > maxX) maxX = p.x + p.w + PAD;
        if (p.y + p.h + PAD > maxY) maxY = p.y + p.h + PAD;
      });
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", String(maxX));
      svg.setAttribute("height", String(maxY));
      var defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      var mark = document.createElementNS("http://www.w3.org/2000/svg", "marker");
      mark.setAttribute("id", "arr");
      mark.setAttribute("viewBox", "0 0 8 8");
      mark.setAttribute("refX", "7");
      mark.setAttribute("refY", "4");
      mark.setAttribute("markerWidth", "7");
      mark.setAttribute("markerHeight", "7");
      mark.setAttribute("orient", "auto");
      var head = document.createElementNS("http://www.w3.org/2000/svg", "path");
      head.setAttribute("d", "M0,1 L8,4 L0,7 Z");
      head.setAttribute("fill", "#888");
      head.setAttribute("fill-opacity", "0.8");
      mark.appendChild(head);
      defs.appendChild(mark);
      svg.appendChild(defs);
      function addPath(d, hot, arrow) {
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", "#888");
        p.setAttribute("stroke-width", hot ? "1.5" : "1");
        p.setAttribute("stroke-opacity", hot ? "0.95" : "0.7");
        if (arrow) p.setAttribute("marker-end", "url(#arr)");
        svg.appendChild(p);
      }
      function inCount(id) { return (dPred[id] || []).length; }
      function joinY(id) { return pos[id].y - Math.round(GAP_Y / 3); }
      var joins = {};
      Object.keys(dSuc).forEach(function (a) {
        var outs = dSuc[a] || [];
        if (!pos[a] || !outs.length) return;
        var x1 = midX(a);
        var y1 = pos[a].y + pos[a].h;
        var hotA = sid(sel) === a;
        function destY(b) {
          return inCount(b) > 1 ? joinY(b) : pos[b].y;
        }
        function destArrow(b) {
          return inCount(b) <= 1;
        }
        if (outs.length === 1) {
          var b = outs[0];
          if (!pos[b]) return;
          var x2 = midX(b);
          var y2 = destY(b);
          var mid = Math.round((y1 + y2) / 2);
          var hot = hotA || sid(sel) === b;
          var d = x1 === x2
            ? "M" + x1 + " " + y1 + " V" + y2
            : "M" + x1 + " " + y1 + " V" + mid + " H" + x2 + " V" + y2;
          addPath(d, hot, destArrow(b));
          if (inCount(b) > 1) joins[b] = true;
          return;
        }
        var stub = y1 + Math.round(GAP_Y / 3);
        addPath("M" + x1 + " " + y1 + " V" + stub, hotA, false);
        outs.forEach(function (b) {
          if (!pos[b]) return;
          var x2 = midX(b);
          var y2 = destY(b);
          var hot = hotA || sid(sel) === b;
          addPath("M" + x1 + " " + stub + " H" + x2 + " V" + y2, hot, destArrow(b));
          if (inCount(b) > 1) joins[b] = true;
        });
      });
      Object.keys(joins).forEach(function (b) {
        if (!pos[b]) return;
        var hot = sid(sel) === b;
        addPath("M" + midX(b) + " " + joinY(b) + " V" + pos[b].y, hot, true);
      });
      board.insertBefore(svg, board.firstChild);
      board.style.width = maxX + "px";
      board.style.height = Math.max(maxY, 120) + "px";
      wrap.scrollLeft = sx;
      wrap.scrollTop = sy;
      if (pinSel && sel) {
        pinSel = false;
        var now = board.querySelector('.box[data-id="' + sid(sel) + '"]');
        if (now && now.scrollIntoView) now.scrollIntoView({ block: "nearest", inline: "nearest" });
      } else {
        pinSel = false;
      }
      var nShow = shown.length;
      var nAll = items.length;
      document.getElementById("status").textContent =
        nShow === nAll ? nAll + " topics." : nShow + " of " + nAll + " topics.";
    }
    document.getElementById("wrap").addEventListener("click", function (ev) {
      if (ev.target === this || ev.target.id === "board") {
        sel = null;
        paint();
      }
    });
    document.getElementById("openall").onclick = function () {
      folded = {};
      saveFold();
      paint();
    };
    document.getElementById("foldall").onclick = function () {
      folded = {};
      buildOrig();
      graphItems().forEach(function (t) {
        if (isMaximalHead(sid(t.id))) folded[sid(t.id)] = true;
      });
      saveFold();
      paint();
    };
    var lastW = 0, lastH = 0;
    function paintWhenReady(force) {
      var wrap = document.getElementById("wrap");
      if (!wrap || wrap.clientWidth < 8) return;
      var w = wrap.clientWidth, h = wrap.clientHeight;
      if (!force && w === lastW && h === lastH) return;
      lastW = w;
      lastH = h;
      paint();
    }
    window.snPaintTree = function () { paintWhenReady(true); };
    loadFold();
    fetch("data/topics.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        topics = rows || [];
        var head = rootId
          ? topics.find(function (t) { return sid(t.id) === sid(rootId); })
          : null;
        document.title = head && head.title ? head.title : "Topics tree";
        paintWhenReady();
      })
      .catch(function (err) {
        document.getElementById("status").textContent = String(err);
      });
    if (window.ResizeObserver) {
      new ResizeObserver(function () { paintWhenReady(); }).observe(document.getElementById("wrap"));
    }
    window.addEventListener("resize", paintWhenReady);
  </script>
</body>
</html>
