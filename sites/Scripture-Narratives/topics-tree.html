<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Tree</title>
  <style>
    :root {
      --ink: #1b3a4b;
      --muted: #5a6a72;
      --line: #c5d0d4;
      --paper: #f6f7eb;
      --panel: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.2rem 0.5rem;
      background: var(--panel);
    }
    .bar button {
      font: 700 0.82rem Arial, Helvetica, sans-serif;
      padding: 0.12rem 0.45rem;
      border: 1px solid var(--line);
      background: #f4f7f8;
      color: var(--title, #005eb8);
      cursor: pointer;
    }
    .bar button:hover { background: #e8eef0; }
    .board-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      background: var(--panel);
    }
    .board { position: relative; display: block; min-width: 100%; min-height: 100%; }
    .tbox {
      position: absolute !important;
      z-index: 2;
      display: flex;
      align-items: stretch;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
    }
    .tbox:hover { background: #f4f7f8; }
    .tbox.on, .tbox.on:hover { background: #f6efc8; }
    .tname {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.2rem 0.45rem;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 400;
    }
    .tcount {
      flex: 0 0 auto;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-left: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
    }
    .thead { cursor: default; }
    .note {
      position: absolute;
      left: 0;
      bottom: 0;
      padding: 0.2rem 0.5rem;
      color: var(--muted);
      font-size: 0.78rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bar">
    <button type="button" class="save" id="save">Save</button>
    <span class="note" id="status"></span>
  </div>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board"></div>
  </div>
  <script src="topics-tree.js?v=227"></script>
  <script>
    document.getElementById("save").onclick = function () {
      if (window.snSaveTopics) window.snSaveTopics("Saved.");
    };
  </script>
</body>
</html>
