<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Tree</title>
  <style>
    :root {
      --ink: #1b3a4b;
      --muted: #5a6a72;
      --line: #c5d0d4;
      --paper: #f6f7eb;
      --panel: #fff;
      --title: #005eb8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    .board-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--panel);
    }
    .tcol {
      position: absolute;
      z-index: 2;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .board { position: relative; display: block; min-width: 100%; min-height: 100%; }
    .tbox {
      position: absolute !important;
      z-index: 2;
      display: flex;
      align-items: stretch;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .tbox:hover { background: #f6efc8; }
    .tbox.on, .tbox.on:hover { background: #f6efc8; }
    .tbox[data-ref] { cursor: grab; }
    .ref-ghost {
      position: fixed;
      z-index: 80;
      pointer-events: none;
      margin: 0;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--line);
      background: #f6efc8;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      white-space: nowrap;
    }
    .tname {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.2rem 0.45rem;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 400;
    }
    .tbtn {
      position: absolute;
      z-index: 2;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .tbtn-teal { background: #1f6f78; color: #fff; }
    .tbtn-teal:hover { background: #186066; }
    .tbtn-green { background: #cdebc8; color: #1b3a4b; }
    .tbtn-green:hover { background: #b7dcb1; }
    .thead { cursor: default; }
    .tdesc {
      position: absolute;
      z-index: 6;
      box-sizing: border-box;
      display: flex;
      align-items: stretch;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      min-height: 26px;
      overflow: hidden;
    }
    .tdesc textarea {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0.2rem 0.45rem;
      border: 0;
      background: transparent;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-wrap: break-word;
      overflow-x: hidden;
      overflow-y: auto;
      resize: none;
      box-sizing: border-box;
    }
    .tdesc textarea:focus { outline: 0; background: #fff; }
    .tdesc-full {
      position: absolute;
      z-index: 20;
      box-sizing: border-box;
      margin: 0;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--line);
      background: #fff;
      font: 400 13px/1.35 Arial, Helvetica, sans-serif;
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      overflow: auto;
      max-height: 70%;
      box-shadow: 0 6px 16px rgba(27,58,75,.12);
      pointer-events: none;
    }
    .tdesc-full[hidden] { display: none !important; }
    .tverse-wrap {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      margin: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
      box-shadow: none;
    }
    .tverse-bar {
      flex: 0 0 auto;
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.4rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .tverse-bar-left {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
      flex: 1 1 auto;
    }
    .tverse-nav {
      display: flex;
      align-items: center;
      gap: 0.28rem;
      flex: 0 0 auto;
    }
    .tverse-bar-right {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-left: auto;
      flex: 0 0 auto;
    }
    .tverse-ref {
      flex: 0 0 auto;
      box-sizing: border-box;
      color: var(--title);
      font: 700 16px/1.2 Arial, Helvetica, sans-serif;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      text-align: center;
      padding: 0 0.15rem;
      background: none;
      border: 0;
    }
    .tverse-bar button.ew-ch-nkjv {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: 600 13px/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
      padding: 0.22rem 0.65rem;
      border-radius: 4px;
    }
    .tverse-bar button.ew-ch-nkjv:hover {
      border-color: var(--title);
      color: var(--title);
    }
    .ew-ch-nkjv.on,
    .ew-ch-tr.on .ew-tr-now {
      background: #e8eef6;
      color: var(--title);
      border-color: var(--title);
    }
    .ew-ch-prev,
    .ew-ch-next {
      position: relative;
      flex: 0 0 auto;
      box-sizing: border-box;
      min-width: 3.4rem;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #e8eef6;
      color: var(--title);
      font: 600 13px/1.2 Arial, Helvetica, sans-serif;
      padding: 0.22rem 0.55rem;
      cursor: pointer;
    }
    .ew-ch-prev:hover:not(:disabled),
    .ew-ch-next:hover:not(:disabled) {
      background: #dce8f2;
      border-color: var(--title);
    }
    .ew-ch-prev:disabled,
    .ew-ch-next:disabled { opacity: 0.35; cursor: default; }
    .ew-tr-pick {
      position: relative;
      display: inline-block;
      font: 600 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
    }
    .ew-tr-now {
      -webkit-appearance: none;
      appearance: none;
      display: inline-block;
      position: relative;
      width: auto;
      min-width: 0;
      padding: 0.22rem 1.2rem 0.22rem 0.4rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .ew-tr-now::after {
      content: "";
      position: absolute;
      right: 0.45rem;
      top: 50%;
      margin-top: -2px;
      border: 4px solid transparent;
      border-top-color: var(--muted);
    }
    .ew-tr-list {
      position: absolute;
      right: 0;
      top: calc(100% + 2px);
      z-index: 8;
      min-width: 0;
      width: max-content;
      max-height: none;
      overflow: visible;
      background: #fff;
      border: 1px solid #d5dee2;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(27,58,75,.12);
      font: inherit;
    }
    .ew-tr-list[hidden] { display: none !important; }
    .ew-tr-list [data-tr] {
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 0.4rem;
      align-items: baseline;
      padding: 0.18rem 0.4rem;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    .ew-tr-code { font-weight: 700; }
    .ew-tr-year {
      text-align: right;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .ew-tr-list [data-tr]:hover { background: #f4f7f8; }
    .ew-tr-list [data-tr].on { background: #eef3f7; color: var(--title); }
    .ew-tr-list [data-tr].on .ew-tr-year { color: var(--title); }
    .tverses {
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 0.45rem 0.6rem;
      border: 0;
      box-shadow: none;
      background: var(--panel);
      font: 400 13px/1.45 Arial, Helvetica, sans-serif;
      color: inherit;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-wrap: break-word;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .tverses p {
      margin: 0;
      padding: 0.12em 0.2rem;
      border: 0;
      box-shadow: none;
      background: transparent;
    }
    .tverse-pick {
      flex: 0 0 auto;
      display: inline-block;
      margin: 0;
      padding: 0.22rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: 600 13px/1.2 Arial, Helvetica, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    .tverse-pick:hover {
      border-color: var(--title);
      color: var(--title);
    }
    .tverse-pick.on {
      background: #e8eef6;
      color: var(--title);
      border-color: var(--title);
    }
    .tverses.picking p { cursor: pointer; }
    .tverses p.hit {
      background: #eaf6e8;
      border: 0;
      box-shadow: none;
    }
    .tverses .vn {
      color: #1f6f78;
      padding-right: 0.25rem;
    }
    .tverses i, .tverses em { font-style: italic; }
    .tverses strong, .tverses b { font-weight: 700; }
    .note {
      position: absolute;
      left: 0;
      bottom: 0;
      padding: 0.2rem 0.5rem;
      color: var(--muted);
      font-size: 0.78rem;
      pointer-events: none;
    }
    #sn-ref-menu {
      position: fixed;
      z-index: 120;
      min-width: 8.5rem;
      width: max-content;
      background: #fff;
      border: 1px solid #c5d0d4;
      box-shadow: 0 8px 22px rgba(0,0,0,.16);
      padding: 0.15rem 0 0.25rem;
    }
    #sn-ref-menu[hidden] { display: none !important; }
    #sn-ref-menu .sn-rhm-title {
      padding: 0.3rem 0.75rem 0.2rem;
      font: 400 0.82rem Arial, Helvetica, sans-serif;
      color: #1f6f78;
      border-bottom: 2px solid var(--title);
      margin-bottom: 0.08rem;
    }
    #sn-ref-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 0.35rem 0.75rem;
      font: 400 0.88rem Arial, Helvetica, sans-serif;
      color: #1b3a4b;
      cursor: pointer;
    }
    #sn-ref-menu button:hover { background: #eef3f4; }
  </style>
</head>
<body>
  <div class="board-wrap" id="wrap">
    <div class="tdesc" id="tdesc"><textarea id="tdesc-ta" title="Description"></textarea></div>
    <div class="tdesc-full" id="tdesc-full" hidden></div>
    <div class="board" id="board"></div>
  </div>
  <span class="note" id="status"></span>
  <div id="sn-ref-menu" hidden>
    <div class="sn-rhm-title">Ref</div>
    <button type="button" data-edit="1">Edit</button>
  </div>
  <script src="topics-tree.js?v=275"></script>
</body>
</html>
