<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topics Tree</title>
  <style>
    :root {
      --ink: #1b3a4b;
      --muted: #5a6a72;
      --line: #c5d0d4;
      --paper: #f6f7eb;
      --panel: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }
    .board-wrap {
      flex: 1 1 auto;
      overflow: auto;
      background: var(--panel);
    }
    .board { position: relative; min-width: 100%; min-height: 100%; }
    .board svg { position: absolute; left: 0; top: 0; z-index: 1; pointer-events: none; }
    .tbox {
      position: absolute;
      z-index: 2;
      margin: 0;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }
    .tbox:hover { background: #f4f7f8; }
    .tbox.on { background: #f6efc8; }
    .thead { cursor: default; }
    .note { padding: 0.35rem 0.7rem; color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board"></div>
  </div>
  <span class="note" id="status"></span>
  <script src="topics-tree.js?v=210"></script>
</body>
</html>
