<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>By Verse</title>
  <style>
    :root {
      --ink: #1b3a4b;
      --muted: #5a6a72;
      --line: #c5d0d4;
      --paper: #f6f7eb;
      --panel: #fff;
      --title: #005eb8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    .verse-heading {
      position: absolute;
      z-index: 55;
      left: 8px;
      top: 1px;
      margin: 0;
      padding: 0 0.25rem 0.12rem;
      font: 400 1.05rem/1.15 Arial, Helvetica, sans-serif;
      color: var(--title);
      background: transparent;
      text-align: center;
      pointer-events: none;
    }
    .board-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--panel);
    }
    .chart-scroll {
      position: absolute;
      z-index: 1;
      overflow-x: auto;
      overflow-y: auto;
      background: var(--panel);
    }
    .tcol {
      position: absolute;
      z-index: 2;
      overflow: hidden;
    }
    .vcol {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      overflow: visible;
    }
    .vcol .tbox,
    .vcol .tbtn {
      position: relative !important;
      left: auto !important;
      top: auto !important;
    }
    .vrow {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 4px;
      box-sizing: border-box;
    }
    .board { position: relative; display: block; min-width: 100%; min-height: 100%; }
    .tbox {
      position: absolute !important;
      z-index: 2;
      display: flex;
      align-items: stretch;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .tbox[data-level="1"] { background: #efe8dc; }
    .tbox[data-level="2"] { background: #d7e4dc; }
    .tbox[data-level="3"] { background: #f6efd2; }
    .tbox[data-level="4"] { background: #dce6f0; }
    .tbox[data-level="1"]:hover,
    .tbox[data-level="1"].on,
    .tbox[data-level="1"].on:hover { background: #efe8dc; }
    .tbox[data-level="2"]:hover,
    .tbox[data-level="2"].on,
    .tbox[data-level="2"].on:hover { background: #d7e4dc; }
    .tbox[data-level="3"]:hover,
    .tbox[data-level="3"].on,
    .tbox[data-level="3"].on:hover { background: #f6efd2; }
    .tbox[data-level="4"]:hover,
    .tbox[data-level="4"].on,
    .tbox[data-level="4"].on:hover { background: #dce6f0; }
    .tbox.stream .tname { color: #8a1f1f; }
    .tbox[data-level="1"] .tname { color: #8a1f1f; }
    .tbox.dim, .tbox.dim .tname { color: #888; }
    .tbox[data-ref],
    .tbox[data-ref]:hover {
      background: #cdebc8;
      color: #1b3a4b;
      cursor: pointer;
    }
    .tbox[data-ref].hit,
    .tbox[data-ref].hit:hover {
      background: #cdebc8;
      color: #1b3a4b;
    }
    .tbox[data-ref].on,
    .tbox[data-ref].on:hover,
    .tbox[data-ref].hit.on,
    .tbox[data-ref].hit.on:hover {
      background: #3d7a45;
      color: #fff;
    }
    .tpath {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }
    .tpath path {
      fill: none;
      stroke-width: 2;
    }
    .ref-ghost {
      position: fixed;
      z-index: 80;
      pointer-events: none;
      margin: 0;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--line);
      background: #eaf6e8;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
      white-space: nowrap;
    }
    .tname {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.2rem 0.45rem;
      white-space: nowrap;
      overflow: hidden;
      font-weight: 400;
    }
    .tbtn {
      position: absolute;
      z-index: 2;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .tbtn-teal { background: #1f6f78; color: #fff; }
    .tbtn-teal:hover { background: #186066; }
    .tbtn-teal.off,
    .tbtn-teal.off:hover {
      background: #1f6f78;
      opacity: 0.35;
      cursor: default;
    }
    .tbtn-green {
      background: #cdebc8;
      color: #1b3a4b;
      font-weight: 700;
    }
    .tbtn-green:hover { background: #b7dcb1; }
    .tbtn-green.open {
      background: #3d7a45;
      color: #fff;
      font-weight: 700;
    }
    .tbtn-green.open:hover { background: #32663a; }
    .tverse-wrap.ref-vs.empty { background: #fff; }
    .tbtn-green.off,
    .tbtn-green.off:hover {
      background: #cdebc8;
      opacity: 0.35;
      cursor: default;
    }
    .thead { cursor: default; }
    .tdesc {
      position: fixed;
      z-index: 40;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      min-height: 26px;
      overflow: hidden;
    }
    .tdesc[hidden] { display: none !important; }
    .tdesc textarea {
      display: block;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0.2rem 0.45rem;
      border: 0;
      background: transparent;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      color: inherit;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-wrap: break-word;
      overflow-x: hidden;
      overflow-y: auto;
      resize: none;
      box-sizing: border-box;
    }
    .tdesc textarea:focus { outline: 0; background: #fff; }
    .tverse-wrap {
      --fs: 13px;
      --fs-lg: calc(var(--fs) * 16 / 13);
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      margin: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
      box-shadow: none;
    }
    .tverse-wrap.chap-vs {
      z-index: 50;
      overflow: visible;
      box-shadow: 14px 16px 32px rgba(27, 58, 75, 0.28);
    }
    .tverse-wrap.chap-vs .tverse-bar {
      overflow: visible;
      z-index: 60;
    }
    .tverse-wrap.chap-vs .tverse-bar-left,
    .tverse-wrap.chap-vs .tverse-nav,
    .tverse-wrap.chap-vs .ew-book-pick,
    .tverse-wrap.chap-vs .ew-ch-pick {
      overflow: visible;
    }
    .tverse-wrap.ref-vs {
      z-index: 50;
      overflow: visible;
      box-shadow: 8px 22px 48px rgba(27, 58, 75, 0.18);
    }
    .tverse-wrap.ref-vs .tverse-bar,
    .tverse-wrap.ref-vs .tverse-bar-left {
      overflow: visible;
      z-index: 60;
    }
    .tverse-size {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 2px;
      z-index: 4;
      cursor: col-resize;
      background: transparent;
    }
    .tverse-wrap.chap-vs .tverse-size {
      top: 28px;
    }
    .tverse-wrap:hover .tverse-size {
      width: 2px;
      right: 0;
      background: var(--line);
    }
    .tverse-bar {
      flex: 0 0 auto;
      position: relative;
      z-index: 6;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0.4em;
      padding: 0.2em 0.4em;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      min-width: 0;
      overflow: hidden;
    }
    .tverse-bar-left {
      display: flex;
      align-items: center;
      gap: 0.35em;
      min-width: min-content;
      flex: 1 1 auto;
      overflow: visible;
    }
    .tverse-bar-right {
      flex: 0 0 auto;
      gap: 0.45em;
    }
    .ew-ch-next {
      z-index: 8;
    }
    .tverse-nav {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0.28em;
      flex: 0 0 auto;
      min-width: 0;
    }
    .ew-chap-mode {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      flex: 0 0 auto;
      margin-right: 0.12rem;
      padding: 0.22rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: #888;
      font: 600 var(--fs, 13px)/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .ew-chap-mode .ew-mode-slash { color: #888; padding: 0; }
    .ew-chap-mode .ew-mode-all,
    .ew-chap-mode .ew-mode-filter { color: #888; }
    .ew-chap-mode.all-on .ew-mode-all,
    .ew-chap-mode.filter-on .ew-mode-filter { color: var(--title); }
    .tverse-bar-right {
      display: flex;
      align-items: center;
      gap: 0.35em;
      margin-left: auto;
      flex: 0 0 auto;
    }
    .ew-ch-lab { white-space: nowrap; }
    .tverse-ref {
      flex: 0 0 auto;
      box-sizing: border-box;
      color: var(--title);
      font: 700 var(--fs-lg, 16px)/1.2 Arial, Helvetica, sans-serif;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      text-align: center;
      padding: 0 0.15rem;
      background: none;
      border: 0;
    }
    .tverse-bar button.ew-ch-nkjv {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: 600 var(--fs, 13px)/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
      padding: 0.22rem 0.65rem;
      border-radius: 4px;
    }
    .tverse-bar button.ew-ch-nkjv:hover {
      border-color: var(--title);
      color: var(--title);
    }
    .ew-ch-nkjv.on,
    .ew-ch-tr.on .ew-tr-now {
      background: #e8eef6;
      color: var(--title);
      border-color: var(--title);
    }
    .ew-ch-prev,
    .ew-ch-next {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.28em;
      flex: 0 0 auto;
      box-sizing: border-box;
      min-width: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #5a6a72;
      font: 400 10px/1.15 Arial, Helvetica, sans-serif;
      letter-spacing: 0.02em;
      padding: 0.15rem 0.2rem;
      cursor: pointer;
      box-shadow: none;
    }
    .ew-ch-arrow {
      display: inline;
      font: inherit;
      color: inherit;
    }
    .ew-ch-prev .page-nav-tip,
    .ew-ch-next .page-nav-tip {
      display: none;
      position: absolute;
      left: 0;
      bottom: calc(100% + 0.28rem);
      z-index: 80;
      padding: 0.15rem 0.45rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--title);
      font: 400 0.85em Arial, Helvetica, sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }
    .ew-ch-next .page-nav-tip { left: auto; right: 0; }
    .ew-ch-prev:hover:not(:disabled) .page-nav-tip,
    .ew-ch-next:hover:not(:disabled) .page-nav-tip,
    .ew-ch-prev:focus:not(:disabled) .page-nav-tip,
    .ew-ch-next:focus:not(:disabled) .page-nav-tip { display: block; }
    .ew-ch-prev:hover:not(:disabled),
    .ew-ch-next:hover:not(:disabled) { color: #1b3a4b; }
    .ew-ch-prev:disabled,
    .ew-ch-next:disabled { opacity: 0.35; cursor: default; }
    .ew-chap-btn.ew-tr-now {
      background: #e8eef6;
      color: var(--title);
      border: 1px solid var(--line);
      font: 600 var(--fs, 13px)/1.2 Arial, Helvetica, sans-serif;
      padding: 0.22rem 1.2rem 0.22rem 0.55rem;
    }
    .ew-chap-btn.ew-tr-now::after { border-top-color: var(--title); }
    .ew-tr-pick {
      position: relative;
      display: inline-block;
      font: 600 var(--fs, 13px)/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
    }
    .ew-tr-now {
      -webkit-appearance: none;
      appearance: none;
      display: inline-block;
      position: relative;
      width: auto;
      min-width: 0;
      padding: 0.22rem 1.2rem 0.22rem 0.4rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .ew-tr-now::after {
      content: "";
      position: absolute;
      right: 0.45rem;
      top: 50%;
      margin-top: -2px;
      border: 4px solid transparent;
      border-top-color: var(--muted);
    }
    .ew-tr-list {
      position: absolute;
      right: 0;
      top: calc(100% + 2px);
      z-index: 80;
      min-width: 0;
      width: max-content;
      max-height: none;
      overflow: visible;
      background: #fff;
      border: 1px solid #d5dee2;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(27,58,75,.12);
      font: inherit;
    }
    .ew-tr-list[hidden] { display: none !important; }
    .ew-tr-list [data-tr] {
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 0.4rem;
      align-items: baseline;
      padding: 0.18rem 0.4rem;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    .ew-tr-code { font-weight: 700; }
    .ew-tr-year {
      text-align: right;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .ew-tr-list [data-tr]:hover { background: #f4f7f8; }
    .ew-tr-list [data-tr].on { background: #eef3f7; color: var(--title); }
    .ew-tr-list [data-tr].on .ew-tr-year { color: var(--title); }
    .tverses {
      flex: 1 1 auto;
      min-height: 4em;
      color: var(--ink);
      margin: 0;
      padding: 0.45rem 0.6rem;
      border: 0;
      box-shadow: none;
      background: var(--panel);
      font: 400 var(--fs, 13px)/1.45 Arial, Helvetica, sans-serif;
      color: inherit;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-wrap: break-word;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .tverses p {
      margin: 0;
      padding: 0.12em 0.2rem;
      border: 0;
      box-shadow: none;
      background: transparent;
    }
    .tverse-pick {
      flex: 0 0 auto;
      display: inline-block;
      margin: 0;
      padding: 0.22rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: 600 var(--fs, 13px)/1.2 Arial, Helvetica, sans-serif;
      white-space: nowrap;
      cursor: pointer;
    }
    .tverse-pick:hover {
      border-color: var(--title);
      color: var(--title);
    }
    .tverse-pick.on {
      background: #e8eef6;
      color: var(--title);
      border-color: var(--title);
    }
    .tverses.picking p { cursor: pointer; }
    .tverses p.hit {
      background: #eaf6e8;
      border: 0;
      box-shadow: none;
      cursor: pointer;
    }
    .tverses p.hit.on {
      background: #eaf6e8;
      box-shadow: inset 0 0 0 1px #c5d0d4;
    }
    .ew-book-pick,
    .ew-ch-pick {
      position: relative;
      display: inline-block;
      font: 600 var(--fs, 13px)/1.2 Arial, Helvetica, sans-serif;
      color: var(--ink);
    }
    .ew-book-list {
      position: absolute;
      left: 0;
      top: calc(100% + 2px);
      z-index: 80;
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 1.1rem;
      padding: 0.2rem 0.35rem 0.35rem;
      width: max-content;
      max-height: 22rem;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #d5dee2;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(27,58,75,.12);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
    }
    .ew-book-list[hidden],
    .ew-ch-grid[hidden] { display: none !important; }
    .ew-book-col {
      display: grid;
      grid-template-columns: max-content max-content;
      column-gap: 0.35rem;
      align-content: start;
      min-width: 0;
    }
    .ew-book-head {
      grid-column: 1 / -1;
      padding: 0.18rem 0.4rem 0.12rem;
      color: var(--muted);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
    }
    .ew-book-list [data-book] {
      padding: 0.18rem 0.4rem;
      cursor: pointer;
      white-space: nowrap;
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
    }
    .ew-book-list [data-book]:hover { background: #f4f7f8; }
    .ew-book-list [data-book].has-topic,
    .ew-ch-grid [data-ch].has-topic { color: #8a1f1f; }
    .ew-book-list [data-book].on { background: #eef3f7; color: var(--title); }
    .ew-ch-grid {
      position: absolute;
      left: 0;
      top: calc(100% + 2px);
      z-index: 80;
      display: grid;
      grid-template-columns: repeat(5, max-content);
      gap: 0.2rem;
      padding: 0.3rem;
      width: max-content;
      max-height: 18rem;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #d5dee2;
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(27,58,75,.12);
    }
    .ew-ch-grid [data-ch] {
      min-width: 1.8rem;
      text-align: center;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 400 13px/1.2 Arial, Helvetica, sans-serif;
      padding: 0.18rem 0.4rem;
      cursor: pointer;
    }
    .ew-ch-grid [data-ch]:hover { background: #f4f7f8; }
    .ew-ch-grid [data-ch].on { background: #eef3f7; color: var(--title); }
    .tverses .vn {
      color: #1f6f78;
      padding-right: 0.25rem;
    }
    .tverses i, .tverses em { font-style: italic; }
    .tverses strong, .tverses b { font-weight: 700; }
    .note {
      position: absolute;
      left: 0;
      bottom: 0;
      padding: 0.2rem 0.5rem;
      color: var(--muted);
      font-size: 0.78rem;
      pointer-events: none;
    }
    #sn-ref-menu {
      position: fixed;
      z-index: 200;
      min-width: 8.5rem;
      width: max-content;
      background: #fff;
      border: 1px solid #c5d0d4;
      box-shadow: 0 8px 22px rgba(0,0,0,.16);
      padding: 0.15rem 0 0.25rem;
    }
    #sn-ref-menu[hidden] { display: none !important; }
    #sn-ref-menu .sn-rhm-title {
      padding: 0.3rem 0.75rem 0.2rem;
      font: 400 0.82rem Arial, Helvetica, sans-serif;
      color: #1f6f78;
      border-bottom: 2px solid var(--title);
      margin-bottom: 0.08rem;
    }
    #sn-ref-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 0.35rem 0.75rem;
      font: 400 0.88rem Arial, Helvetica, sans-serif;
      color: #1b3a4b;
      cursor: pointer;
    }
    #sn-ref-menu button:hover { background: #eef3f4; }
  </style>
</head>
<body>
  <div class="board-wrap" id="wrap">
    <h1 class="verse-heading" id="verse-heading"></h1>
    <div class="tdesc" id="tdesc" hidden><textarea id="tdesc-ta" title="Description"></textarea></div>
    <div class="chart-scroll" id="chart">
      <div class="board" id="board"></div>
    </div>
  </div>
  <span class="note" id="status"></span>
  <div id="sn-ref-menu" hidden>
    <div class="sn-rhm-title">Topic</div>
    <button type="button" data-edit="1">Edit</button>
  </div>
  <script src="topics-verse.js?v=385"></script>
</body>
</html>
