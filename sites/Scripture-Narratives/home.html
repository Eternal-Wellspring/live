  <script>
function showTab(id){
  if (!id || !document.getElementById(id)) return;
  document.querySelectorAll(".tab[data-tab]").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===id); });
  document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.toggle("active", p.id===id); });
  document.querySelectorAll(".end-sub-tabs").forEach(function(el){ el.hidden = el.getAttribute("data-for") !== id; });
  if (window.ewFitHead) requestAnimationFrame(function(){ window.ewFitHead(); });
}
function pageFile(href){
  var path = String(href || "").split("#")[0].split("?")[0];
  return path ? path.split("/").pop() : "";
}
function isHomeName(f){
  f = String(f || "");
  return f === "home.html" || f === "index.html" || f === "1-home.html";
}
function samePage(href){
  var file = pageFile(href);
  var here = pageFile(location.pathname) || "index.html";
  if (!file || file === here) return true;
  return isHomeName(file) && isHomeName(here);
}
function tabFromHref(href){
  var i = String(href || "").indexOf("#");
  return i >= 0 ? href.slice(i + 1) : "";
}
document.addEventListener("click", function(ev){
  var sub = ev.target.closest(".sub-tab");
  if (sub && sub.dataset.sub) {
    var wrap = sub.closest(".tab-panel");
    if (!wrap) {
      var end = sub.closest(".end-sub-tabs");
      var forId = end && end.getAttribute("data-for");
      wrap = forId ? document.getElementById(forId) : null;
    }
    if (!wrap) return;
    var id = sub.dataset.sub;
    wrap.querySelectorAll(".sub-tab").forEach(function(b){ b.classList.toggle("active", b.dataset.sub===id); });
    wrap.querySelectorAll(".sub-tab-panel").forEach(function(p){ p.classList.toggle("active", p.dataset.sub===id); });
    var endBar = document.querySelector('.end-sub-tabs[data-for="' + wrap.id + '"]');
    if (endBar) endBar.querySelectorAll(".sub-tab").forEach(function(b){ b.classList.toggle("active", b.dataset.sub===id); });
    if (window.ewFitHead) requestAnimationFrame(function(){ window.ewFitHead(); });
    return;
  }
  var btn = ev.target.closest(".tab");
  if (btn && btn.dataset.tab) {
    var id = btn.dataset.tab;
    showTab(id);
    if (id && location.hash.slice(1) !== id) {
      if (history.replaceState) history.replaceState(null, "", "#" + id);
      else location.hash = id;
    }
    return;
  }
  var a = ev.target.closest(".contents-list a");
  if (!a) return;
  if (!samePage(a.getAttribute("href") || "")) return;
  ev.preventDefault();
  var tid = tabFromHref(a.getAttribute("href") || "") || "s0";
  showTab(tid);
  if (tid && history.replaceState) history.replaceState(null, "", "#" + tid);
  else if (tid) location.hash = tid;
  window.scrollTo(0, 0);
});
window.addEventListener("hashchange", function(){
  if (location.hash) showTab(location.hash.slice(1));
  window.scrollTo(0, 0);
});
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
var startTab = location.hash ? location.hash.slice(1) : "s0";
if (location.hash && history.replaceState) history.replaceState(null, "", location.pathname + location.search);
showTab(startTab);
window.scrollTo(0, 0);
window.addEventListener("load", function(){ window.scrollTo(0, 0); });

(function(){
  function isFull(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function paint(){
    var btn = document.getElementById("ew-full");
    if (btn) btn.textContent = isFull() ? "Exit Full Screen" : "Full Screen";
  }
  function go(){
    if (isFull()) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (req) req.call(el);
  }
  function pageFile(href){
    var path = String(href || "").split("#")[0].split("?")[0];
    return path ? path.split("/").pop() : "";
  }
  function hereFile(){
    return pageFile(location.pathname) || "index.html";
  }
  function isHomeName(f){
    f = String(f || "");
    return f === "home.html" || f === "index.html" || f === "1-home.html";
  }
  function isOtherHtml(href){
    var file = pageFile(href);
    var here = hereFile();
    if (!file || !/\.html$/i.test(file)) return false;
    if (file === here) return false;
    if (isHomeName(file) && isHomeName(here)) return false;
    return true;
  }
  function swapTo(href){
    fetch(href, { credentials: "same-origin" })
      .then(function(r){ if (!r.ok) throw new Error("nav"); return r.text(); })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, "text/html");
        var next = doc.querySelector(".page-frame");
        var cur = document.querySelector(".page-frame");
        if (!next || !cur) { location.href = href; return; }
        cur.innerHTML = next.innerHTML;
        document.title = doc.title;
        var dp = doc.documentElement.getAttribute("data-page");
        if (dp) document.documentElement.setAttribute("data-page", dp);
        var fmt = doc.getElementById("ew-format");
        var mine = document.getElementById("ew-format");
        if (fmt && mine) mine.textContent = fmt.textContent;
        try { history.pushState({ ew: 1 }, "", href); } catch (e) {}
        paint();
        var hash = "";
        var hi = String(href).indexOf("#");
        if (hi >= 0) hash = href.slice(hi + 1);
        if (hash && window.showTab) window.showTab(hash);
        document.dispatchEvent(new Event("ew-page-swap"));
        window.scrollTo(0, 0);
        document.querySelectorAll("a.ew-mark").forEach(function(a){
          a.href = "/";
        });
      })
      .catch(function(){ location.href = href; });
  }
  document.addEventListener("click", function(ev){
    if (ev.target.closest("#ew-full")) {
      ev.preventDefault();
      go();
      return;
    }
    if (!isFull()) return;
    var a = ev.target.closest("a.page-nav, .contents-list a");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (!href || href.charAt(0) === "#") return;
    if (!isOtherHtml(href)) return;
    ev.preventDefault();
    swapTo(href);
  });
  window.addEventListener("popstate", function(){
    if (!isFull()) return;
    swapTo(location.pathname + location.search + location.hash);
  });
  document.addEventListener("fullscreenchange", paint);
  document.addEventListener("webkitfullscreenchange", paint);
  paint();
})();
</script><script>
(function(){
  function isPhone(){
    var ua = navigator.userAgent || "";
    if (/iPad/i.test(ua)) return false;
    if (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1) return false;
    if (/iPhone|iPod/i.test(ua)) return true;
    if (/Android/i.test(ua) && /Mobile/i.test(ua)) return true;
    return false;
  }
  function markPhone(){
    var phone = isPhone();
    document.documentElement.classList.toggle("ew-phone", phone);
    var portrait = phone && window.matchMedia && window.matchMedia("(orientation: portrait)").matches;
    document.documentElement.classList.toggle("ew-portrait", !!portrait);
    var btn = document.getElementById("ew-full");
    if (btn) {
      if (phone) btn.style.setProperty("display", "none", "important");
      else btn.style.removeProperty("display");
    }
  }
  function contentHeight(col){
    var inner = col.querySelector(".col-text") || col;
    var kids = [];
    for (var i = 0; i < inner.children.length; i++) {
      var ch = inner.children[i];
      if (ch.classList && ch.classList.contains("col-pic-alt") && !String(ch.textContent || "").trim()) continue;
      kids.push(ch);
    }
    var body = 0;
    if (kids.length) {
      body = Math.round(kids[kids.length - 1].getBoundingClientRect().bottom - kids[0].getBoundingClientRect().top);
    } else {
      body = inner.scrollHeight;
    }
    var cs = getComputedStyle(col);
    var pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    return Math.max(1, body + pad);
  }
  function equalisePics(){
    var portrait = document.documentElement.classList.contains("ew-portrait");
    document.querySelectorAll(".para").forEach(function(row){
      var panel = row.closest(".tab-panel");
      if (panel && !panel.classList.contains("active")) return;
      if (row.clientWidth < 8) return;
      var cols = [];
      for (var i = 0; i < row.children.length; i++) {
        var el = row.children[i];
        if (el.classList && el.classList.contains("col") && !el.classList.contains("col-footnotes")) cols.push(el);
      }
      var pics = [];
      var textCol = null;
      cols.forEach(function(c){
        if (c.querySelector("img.col-pic")) pics.push(c);
        else if (!textCol) textCol = c;
      });
      if (!pics.length) return;
      function clearPicSize(picCol){
        var img = picCol.querySelector("img.col-pic");
        if (!img) return;
        img.style.height = "";
        img.style.maxHeight = "";
        img.style.width = "";
        img.style.maxWidth = "";
        img.style.objectFit = "";
        img.style.objectPosition = "";
        picCol.style.flex = "";
        picCol.style.width = "";
        picCol.style.maxWidth = "";
        picCol.style.minWidth = "";
      }
      pics.forEach(clearPicSize);
      if (portrait) return;
      var rowW = row.clientWidth;
      var nCols = Math.max(1, cols.length);
      var maxPic = Math.max(1, Math.floor(rowW / nCols));
      function setPic(picCol, tw, capPct){
        var img = picCol.querySelector("img.col-pic");
        if (!img) return;
        var nw = img.naturalWidth || img.width;
        var nh = img.naturalHeight || img.height;
        if (!nw || !nh) return;
        tw = Math.max(1, Math.round(tw));
        var ih = Math.round(tw * nh / nw);
        img.style.boxSizing = "border-box";
        img.style.width = tw + "px";
