<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eternal Wellspring</title>
  <link rel="icon" href="images/icon.jpg" />
  <link rel="stylesheet" href="index.css?v=9" />
</head>
<body class="home-page">
  <header class="home-top">
    <a class="ew-mark" href="home.html">
      <img src="images/icon.jpg" alt="" />
      <span class="ew-words">Eternal<br />Wellspring</span>
    </a>
  </header>

  <section class="ew-board">
    <div class="ew-col">
      <h2>Categories</h2>
      <div id="topics" class="ew-pick" role="listbox" aria-label="Categories"></div>
    </div>
    <div id="sites-col" class="ew-col" hidden>
      <h2>Websites</h2>
      <div id="sites" class="ew-pick" role="listbox" aria-label="Websites"></div>
      <p id="sites-empty" class="ew-empty" hidden>None in this category yet.</p>
    </div>
  </section>

  <script>
    var categories = [];
    var sites = [];
    var chosenCat = "";

    function $(id) {
      return document.getElementById(id);
    }

    function catName(c) {
      return String((c && c.name) || "").trim();
    }

    function sameCat(a, b) {
      return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
    }

    function isEndTimes(name) {
      var n = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
      return n === "endtimesprophecies" || n === "endtimeprophecies";
    }

    function isHall(s) {
      var f = String((s && s.folder) || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
      var n = String((s && s.name) || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
      return f === "eternalwellspring" || n === "eternalwellspring";
    }

    function webSites() {
      return sites.filter(function (s) {
        return s && s.href && s.name && !isHall(s) && s.showOnWeb !== false;
      });
    }

    function sitesIn(cat) {
      return webSites().filter(function (s) {
        return sameCat(s.category, cat);
      });
    }

    function categoriesFromWebsites() {
      var have = {};
      webSites().forEach(function (s) {
        var n = String(s.category || "").trim();
        if (!n) return;
        var k = n.toLowerCase();
        if (!have[k]) have[k] = n;
      });
      var out = [];
      (categories || []).forEach(function (c) {
        var name = catName(c);
        if (!name) return;
        var k = name.toLowerCase();
        if (have[k]) {
          out.push(have[k]);
          delete have[k];
        }
      });
      Object.keys(have).sort().forEach(function (k) {
        out.push(have[k]);
      });
      return out;
    }

    function fillTopics() {
      var box = $("topics");
      box.innerHTML = "";
      categoriesFromWebsites().forEach(function (name) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = sameCat(name, chosenCat) ? "on" : "";
        btn.setAttribute("role", "option");
        btn.setAttribute("aria-selected", sameCat(name, chosenCat) ? "true" : "false");
        btn.textContent = name;
        btn.addEventListener("click", function () {
          chosenCat = name;
          fillTopics();
          fillSites();
        });
        box.appendChild(btn);
      });
    }

    function fillSites() {
      var col = $("sites-col");
      var box = $("sites");
      var empty = $("sites-empty");
      var board = document.querySelector(".ew-board");
      var show = isEndTimes(chosenCat);
      col.hidden = !show;
      if (board) board.classList.toggle("has-sites", show);
      box.innerHTML = "";
      if (!show) {
        empty.hidden = true;
        return;
      }
      var list = sitesIn(chosenCat);
      empty.hidden = list.length > 0;
      list.forEach(function (s) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("role", "option");
        btn.setAttribute("aria-selected", "false");
        btn.textContent = s.tagline ? s.name + " - " + s.tagline : s.name;
        btn.addEventListener("click", function () {
          var href = siteHref(s);
          if (href) window.location.href = href;
        });
        box.appendChild(btn);
      });
    }

    function siteHref(s) {
      if (!s) return "";
      if (location.protocol === "file:" && s.folder) return "sites/" + s.folder + "/home.html";
      return s.href || "";
    }

    function start() {
      chosenCat = "";
      fillTopics();
      fillSites();
    }

    var fallbackCategories = [
      { name: "End Times Prophecies" },
      { name: "Torah - God's Ways" },
      { name: "Yahweh's Seven Festivals" }
    ];
    var fallbackSites = [
      { folder: "His-Finished-Work", name: "His Finished Work", tagline: "The best is yet to come.", category: "End Times Prophecies", href: "/His-Finished-Work/" },
      { folder: "Scripture-Narratives", name: "Scripture Narratives", tagline: "Scripture for Biblical Narratives", category: "End Times Prophecies", href: "/Scripture-Narratives/" },
      { folder: "Waiting-for-the-sons-of-God", name: "Waiting for the sons of God", tagline: "Creation is waiting for you.", category: "End Times Prophecies", href: "/Waiting-for-the-sons-of-God/" }
    ];

    function useLists(catList, siteList) {
      categories = catList || [];
      sites = ((siteList && siteList.length) ? siteList : fallbackSites).slice().sort(function (a, b) {
        return String(a && a.name || "").localeCompare(String(b && b.name || ""), "en", { sensitivity: "base" });
      });
      start();
    }

    Promise.all([
      fetch("categories.json").then(function (r) { return r.ok ? r.json() : { categories: [] }; }).catch(function () { return { categories: [] }; }),
      fetch("sites.json").then(function (r) { return r.ok ? r.json() : { sites: [] }; }).catch(function () { return { sites: [] }; })
    ]).then(function (pair) {
      useLists(pair[0].categories || [], pair[1].sites || []);
    }).catch(function () {
      useLists([], []);
    });
  </script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
