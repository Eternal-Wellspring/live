<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eternal Wellspring</title>
  <link rel="icon" href="images/icon.jpg" />
  <link rel="stylesheet" href="index.css?v=4" />
</head>
<body class="home-page">
  <header class="home-top">
    <a class="ew-mark" href="index.html">
      <img src="images/icon.jpg" alt="" />
      <span class="ew-words">Eternal<br />Wellspring</span>
    </a>
  </header>

  <section class="home-hero">
    <h1>Eternal Wellspring</h1>
    <p class="tagline">Read the story — Open the Word</p>
    <p class="tagline-sub">The Word stands forever — living water, one tap away.</p>
    <div id="sites" class="site-list"></div>
  </section>
  <script>
    fetch("sites.json")
      .then(function (r) { return r.ok ? r.json() : { sites: [] }; })
      .catch(function () { return { sites: [] }; })
      .then(function (data) {
        var box = document.getElementById("sites");
        (data.sites || []).slice().sort(function (a, b) {
          return String(a && a.name || "").localeCompare(String(b && b.name || ""), "en", { sensitivity: "base" });
        }).forEach(function (s) {
          if (!s || !s.href || !s.name) return;
          var a = document.createElement("a");
          a.href = s.href;
          a.textContent = s.name;
          box.appendChild(a);
        });
      });
  </script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
