  <script>
function showTab(id){
  if (!id || !document.getElementById(id)) return;
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.tab===id); });
  document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.toggle("active", p.id===id); });
}
function pageFile(href){
  var path = String(href || "").split("#")[0].split("?")[0];
  return path ? path.split("/").pop() : "";
}
function samePage(href){
  var file = pageFile(href);
  var here = pageFile(location.pathname) || "home.html";
  if (!file || file === here) return true;
  return (file === "home.html" || file === "index.html") && (here === "home.html" || here === "index.html");
}
function tabFromHref(href){
  var i = String(href || "").indexOf("#");
  return i >= 0 ? href.slice(i + 1) : "";
}
document.querySelectorAll(".tab").forEach(function(btn){
  btn.addEventListener("click", function(){
    var id = btn.dataset.tab;
    showTab(id);
    if (id && location.hash.slice(1) !== id) {
      if (history.replaceState) history.replaceState(null, "", "#" + id);
      else location.hash = id;
    }
  });
});
document.querySelectorAll(".contents-list a").forEach(function(a){
  a.addEventListener("click", function(ev){
    if (!samePage(a.getAttribute("href") || "")) return;
    ev.preventDefault();
    var id = tabFromHref(a.getAttribute("href") || "") || "s1";
    showTab(id);
    if (id && history.replaceState) history.replaceState(null, "", "#" + id);
    else if (id) location.hash = id;
    window.scrollTo(0, 0);
  });
});
window.addEventListener("hashchange", function(){
  if (location.hash) showTab(location.hash.slice(1));
  window.scrollTo(0, 0);
});
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
var startTab = location.hash ? location.hash.slice(1) : "s1";
if (location.hash && history.replaceState) history.replaceState(null, "", location.pathname + location.search);
showTab(startTab);
window.scrollTo(0, 0);
window.addEventListener("load", function(){ window.scrollTo(0, 0); });
